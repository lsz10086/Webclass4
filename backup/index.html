<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Finder App</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>
    <div class="container">
      <header>
        <h1><i class="book"></i> lszhi的前端网页作品集</h1>
        <p>这是我的前端网页作品，点击可以跳转到具体页面！</p>
      </header>

      <!-- <p class="api-link">Data from <a href="https://www.themealdb.com/api.php">TheMealDB 🍽️</a></p> -->

      <!-- 
      <div class="search-container">
        <input type="text" id="search-input" placeholder="Search for meals or keywords" />
        <button id="search-btn">Search</button>
      </div>
      -->

      <div id="error-container" class="hidden">
        <p>No meals found. Try another search term!</p>
      </div>

      <div id="result-heading"></div>

      <div id="meals" class="meals-container">
        <div class="meal" data-url="https://classhomework2.vercel.app/">
          <img src="./img/quiztime.png">
          <div class="meal-info">
            <h3 class="meal-title">Quiz Time</h3>
            <div class="meal-category">Quiz</div>
          </div>
        </div>

        <div class="meal" data-url="https://shuangzhi.cyou/">
          <img src="./img/register.png">
          <div class="meal-info">
            <h3 class="meal-title">Register Form</h3>
            <div class="meal-category">Register</div>
          </div>
        </div>

        <div class="meal" data-url="afterclass2-two.vercel.app">
          <img src="./img/recipe.png">
          <div class="meal-info">
            <h3 class="meal-title">Recipe Finder</h3>
            <div class="meal-category">Recipe</div>
          </div>
        </div>
      </div>

      <div id="meal-details" class="hidden">
        <button id="back-btn"><i class="fas fa-arrow-left"></i> Back to recipes</button>

        <div class="meal-details-content"></div>
      </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
