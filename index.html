<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lszhi的前端网页作品集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=4" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>
    <div class="container">
      <header class="hero">
        <span class="hero-dot" aria-hidden="true"></span>
        <h1>szliang的前端网页作品集</h1>
        <p>这是我的前端网页作品，点击卡片可以跳转到具体页面</p>
      </header>

      <section class="works">
        <h2>Works</h2>

        <div id="meals" class="meals-container">
          <article class="meal" data-url="https://classhomework2.vercel.app/">
            <div class="meal-preview">
              <img src="./img/quiztime.png" alt="Quiz Time 预览">
            </div>
            <div class="meal-info">
              <h3 class="meal-title"><span class="step">1</span> Quiz Time</h3>
              <p class="meal-desc">互动问答页面，点击即可进入完整作品</p>
              <div class="meal-category">Quiz</div>
            </div>
          </article>

          <article class="meal" data-url="https://shuangzhi.cyou/">
            <div class="meal-preview">
              <img src="./img/register.png" alt="Register Form 预览">
            </div>
            <div class="meal-info">
              <h3 class="meal-title"><span class="step">2</span> Register Form</h3>
              <p class="meal-desc">注册表单界面，点击即可进入完整作品</p>
              <div class="meal-category">Register</div>
            </div>
          </article>

          <article class="meal" data-url="https://afterclass2-two.vercel.app">
            <div class="meal-preview">
              <img src="./img/recipe.png" alt="Recipe Finder 预览">
            </div>
            <div class="meal-info">
              <h3 class="meal-title"><span class="step">3</span> Recipe Finder</h3>
              <p class="meal-desc">食谱检索应用，点击即可进入完整作品</p>
              <div class="meal-category">Recipe</div>
            </div>
          </article>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
